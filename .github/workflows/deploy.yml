# Publica o site no GitHub Pages a cada push na main.
# O site vai pronto em dist/ (python scripts/build.py): o build precisa das fotos em resolução máxima,
# que ficam fora do repositório, então aqui só se publica o que já está em dist/.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true # o .nojekyll também vai para o ar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
